name: Build desktop apps

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS menu bar app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift 6
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Build app bundle
        run: bash macos/build_app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/AgentWatch.app AgentWatch-macOS-arm64.zip
      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: AgentWatch-macOS-arm64
          path: AgentWatch-macOS-arm64.zip

  windows:
    name: Build Windows tray app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build app
        shell: pwsh
        run: ./windows/build_app.ps1
      - name: Package app
        shell: pwsh
        run: Compress-Archive -Path build/windows/AgentWatchTray/* -DestinationPath AgentWatch-Windows-x64.zip -Force
      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: AgentWatch-Windows-x64
          path: AgentWatch-Windows-x64.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    permissions:
      contents: write
    steps:
      - name: Download app packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/AgentWatch-macOS-arm64.zip \
            release-assets/AgentWatch-Windows-x64.zip \
            --generate-notes
